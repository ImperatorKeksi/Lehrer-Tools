<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="E-Mail Verifizierung - Lehrer Tools">
    <meta name="author" content="Nico">
    <meta name="theme-color" content="#9d4edd">
    <title>E-Mail Verifizierung - Lehrer Tools</title>
    <link rel="icon" type="image/svg+xml" href="../icons/logo-simple.svg">
    <link rel="stylesheet" href="../stylesheets/main.css">
    <link rel="stylesheet" href="../stylesheets/animations.css">
    <link rel="stylesheet" href="../stylesheets/responsive.css">

    <style>
        /* CSS Variablen */
        :root {
            --spacing-xs: clamp(0.25rem, 1vw, 0.5rem);
            --spacing-sm: clamp(0.5rem, 2vw, 1rem);
            --spacing-md: clamp(1rem, 3vw, 1.5rem);
            --spacing-lg: clamp(1.5rem, 4vw, 2.5rem);
            --spacing-xl: clamp(2rem, 5vw, 3.5rem);
            --spacing-xxl: clamp(2.5rem, 6vw, 4rem);

            --font-xs: clamp(0.75rem, 1.5vw, 0.875rem);
            --font-sm: clamp(0.875rem, 2vw, 1rem);
            --font-md: clamp(1rem, 2.5vw, 1.125rem);
            --font-lg: clamp(1.25rem, 3.5vw, 1.75rem);
            --font-xl: clamp(1.75rem, 4.5vw, 2.5rem);
            --font-xxl: clamp(2.5rem, 6vw, 4rem);

            --color-bg: #0a0a0a;
            --color-accent: #9d4edd;
            --color-primary: #e0aaff;
            --color-secondary: #c77dff;
            --color-card-bg: rgba(26, 26, 26, 0.95);

            --border-radius: clamp(0.75rem, 2vw, 1.5rem);
        }

        @media (min-width: 1025px) {
            :root {
                --spacing-xs: 0.5rem;
                --spacing-sm: 1rem;
                --spacing-md: 1.5rem;
                --spacing-lg: 2.5rem;
                --spacing-xl: 3.5rem;
                --spacing-xxl: 5rem;

                --font-xs: 0.875rem;
                --font-sm: 1rem;
                --font-md: 1.125rem;
                --font-lg: 1.75rem;
                --font-xl: 2.5rem;
                --font-xxl: 4rem;

                --border-radius: 1.5rem;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--color-bg);
            color: var(--color-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Keks-Regen Animation! 🍪 */
        @keyframes cookieFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .cookie-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .cookie {
            position: absolute;
            font-size: 30px;
            animation: cookieFall linear infinite;
            opacity: 0.7;
        }

        /* Floating Kekse im Hintergrund */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-20px) rotate(5deg);
            }

            50% {
                transform: translateY(-10px) rotate(-5deg);
            }

            75% {
                transform: translateY(-15px) rotate(3deg);
            }
        }

        .floating-cookies {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-cookie {
            position: absolute;
            font-size: 100px;
            opacity: 0.05;
            animation: float 8s ease-in-out infinite;
        }

        /* Verification Container */
        .verification-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-md);
            position: relative;
            z-index: 10;
        }

        .verification-card {
            background: var(--color-card-bg);
            border: 2px solid rgba(199, 125, 255, 0.3);
            border-radius: var(--border-radius);
            padding: var(--spacing-xxl) var(--spacing-xl);
            max-width: 650px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.5s ease-out, cardGlow 2s ease-in-out infinite;
            box-shadow: 0 25px 80px rgba(157, 78, 221, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Keks-Glitzer-Effekt */
        .verification-card::before {
            content: '🍪';
            position: absolute;
            top: -30px;
            right: -30px;
            font-size: 120px;
            opacity: 0.1;
            transform: rotate(-15deg);
            animation: rotate 20s linear infinite;
        }

        .verification-card::after {
            content: '🍪';
            position: absolute;
            bottom: -40px;
            left: -40px;
            font-size: 150px;
            opacity: 0.08;
            transform: rotate(25deg);
            animation: rotate 25s linear infinite reverse;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes cardGlow {

            0%,
            100% {
                box-shadow: 0 25px 80px rgba(157, 78, 221, 0.4);
            }

            50% {
                box-shadow: 0 25px 100px rgba(157, 78, 221, 0.6);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .verification-icon {
            width: 140px;
            height: 140px;
            margin: 0 auto var(--spacing-lg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            animation: iconPop 0.6s ease-out 0.3s both, iconBounce 2s ease-in-out 1s infinite;
            border: 5px solid rgba(157, 78, 221, 0.3);
            position: relative;
            z-index: 2;
        }

        @keyframes iconPop {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes iconBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .verification-icon.success {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.5);
        }

        .verification-icon.error {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            box-shadow: 0 15px 40px rgba(239, 68, 68, 0.5);
        }

        .verification-title {
            font-size: var(--font-xxl);
            font-weight: 800;
            margin-bottom: var(--spacing-md);
            line-height: 1.2;
            position: relative;
            z-index: 2;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.02);
            }
        }

        .verification-title.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .verification-title.error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .username-highlight {
            display: inline-block;
            padding: var(--spacing-md) var(--spacing-xl);
            background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
            border-radius: var(--border-radius);
            color: var(--color-accent);
            font-weight: 700;
            font-size: var(--font-lg);
            margin: var(--spacing-md) 0 var(--spacing-lg);
            border: 2px solid rgba(157, 78, 221, 0.3);
            animation: pulse 2s infinite, wiggle 3s ease-in-out infinite;
            box-shadow: 0 8px 25px rgba(157, 78, 221, 0.3);
            position: relative;
            z-index: 2;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 8px 25px rgba(157, 78, 221, 0.3);
            }

            50% {
                box-shadow: 0 12px 40px rgba(157, 78, 221, 0.5);
            }
        }

        @keyframes wiggle {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-2deg);
            }

            75% {
                transform: rotate(2deg);
            }
        }

        .verification-message {
            font-size: var(--font-md);
            color: var(--color-secondary);
            line-height: 1.7;
            margin-bottom: var(--spacing-xl);
            position: relative;
            z-index: 2;
        }

        .cookie-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: var(--spacing-xl) 0;
            position: relative;
            z-index: 2;
        }

        .cookie-divider::before,
        .cookie-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(199, 125, 255, 0.3), transparent);
        }

        .cookie-divider span {
            font-size: 40px;
            margin: 0 var(--spacing-md);
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .additional-info {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.15), rgba(199, 125, 255, 0.1));
            border-left: 4px solid var(--color-accent);
            border-radius: calc(var(--border-radius) / 2);
            padding: var(--spacing-md);
            margin: var(--spacing-lg) 0;
            font-size: var(--font-sm);
            color: var(--color-secondary);
            text-align: left;
            position: relative;
            z-index: 2;
            animation: infoPulse 3s ease-in-out infinite;
        }

        @keyframes infoPulse {

            0%,
            100% {
                background: rgba(157, 78, 221, 0.1);
            }

            50% {
                background: rgba(157, 78, 221, 0.2);
            }
        }

        .btn {
            display: inline-block;
            padding: var(--spacing-md) var(--spacing-xl);
            background: linear-gradient(135deg, var(--color-accent) 0%, #7209b7 100%);
            color: #fff;
            text-decoration: none;
            border-radius: var(--border-radius);
            font-size: var(--font-md);
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(157, 78, 221, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(157, 78, 221, 0.6);
        }

        .footer-text {
            color: #999;
            font-size: var(--font-xs);
            margin-top: var(--spacing-lg);
            position: relative;
            z-index: 2;
        }

        .loading-spinner {
            display: inline-block;
            width: 60px;
            height: 60px;
            border: 6px solid rgba(157, 78, 221, 0.2);
            border-top: 6px solid var(--color-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: var(--spacing-lg) auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .verification-card {
                padding: var(--spacing-xl) var(--spacing-lg);
                margin: var(--spacing-md);
            }

            .verification-icon {
                width: 100px;
                height: 100px;
                font-size: 50px;
                margin-bottom: var(--spacing-md);
            }

            .username-highlight {
                padding: var(--spacing-sm) var(--spacing-md);
                font-size: var(--font-md);
            }
        }

        @media (max-width: 480px) {
            .verification-card {
                padding: var(--spacing-lg) var(--spacing-md);
            }

            .verification-icon {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }

            .verification-title {
                font-size: var(--font-xl);
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- Floating Kekse im Hintergrund -->
    <div class="floating-cookies">
        <div class="floating-cookie" style="top:10%;left:5%;animation-delay:0s;">🍪</div>
        <div class="floating-cookie" style="top:20%;right:10%;animation-delay:1s;">🍪</div>
        <div class="floating-cookie" style="bottom:15%;left:15%;animation-delay:2s;">🍪</div>
        <div class="floating-cookie" style="bottom:25%;right:8%;animation-delay:3s;">🍪</div>
    </div>

    <!-- Keks-Regen (nur bei Erfolg) -->
    <div class="cookie-rain" id="cookieRain" style="display:none;"></div>

    <!-- Bubble-Hintergrund -->
    <iframe src="background-bubbles-boxes.html"
        style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;border:none;pointer-events:none;"
        aria-hidden="true" tabindex="-1"></iframe>

    <!-- Verification Content -->
    <div class="verification-container">
        <div class="verification-card" id="verificationContent">
            <div class="loading-spinner"></div>
            <p class="verification-message">Verifizierung läuft... 🍪</p>
        </div>
    </div>

    <script>
        // URL Parameter auslesen
        const urlParams = new URLSearchParams(window.location.search);
        const success = urlParams.get('success');
        const message = urlParams.get('message');
        const username = urlParams.get('username');
        const content = document.getElementById('verificationContent');

        // Zeige Erfolg oder Fehler
        if (success === '1') {
            showSuccess(message || 'Dein Account wurde erfolgreich erstellt!', username);
            startCookieRain(); // 🍪 Keks-Regen starten!
        } else {
            showError(message || 'Ein Fehler ist aufgetreten.');
        }

        function showSuccess(msg, user) {
            content.innerHTML = `
                <div class="verification-icon success">🍪</div>
                
                <h1 class="verification-title success">🎉 Keks-tastrophal gut! 🎉</h1>
                
                ${user ? `
                <div class="username-highlight">
                    👤 Willkommen, ${escapeHtml(user)}! 🍪
                </div>
                ` : ''}
                
                <p class="verification-message">${escapeHtml(msg)}</p>
                
                <div class="additional-info">
                    💡 <strong>Tipp:</strong> Bewahre deine Anmeldedaten sicher auf. Du erhältst eine Willkommens-E-Mail mit allen wichtigen Infos!
                </div>
                
                <div class="cookie-divider">
                    <span>🍪</span>
                </div>
                
                <a href="start.html" class="btn">
                    🚀 Zur Anmeldung
                </a>
                
                <p class="footer-text">
                    Viel Spaß mit den Lehrer Tools! 🎮✨
                </p>
            `;
        }

        function showError(msg) {
            content.innerHTML = `
                <div class="verification-icon error">🍪</div>
                
                <h1 class="verification-title error">🍪 Ups, Keks zerbröselt! 😢</h1>
                
                <p class="verification-message">${escapeHtml(msg)}</p>
                
                <div class="cookie-divider">
                    <span>🍪</span>
                </div>
                
                <a href="start.html" class="btn">
                    🏠 Zurück zur Startseite
                </a>
                
                <p class="footer-text">
                    Bei Fragen: support@nicolehrertools.de 📧
                </p>
            `;
        }

        // 🍪 Keks-Regen Animation!
        function startCookieRain() {
            const cookieRain = document.getElementById('cookieRain');
            cookieRain.style.display = 'block';

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const cookie = document.createElement('div');
                    cookie.className = 'cookie';
                    cookie.textContent = '🍪';
                    cookie.style.left = Math.random() * 100 + '%';
                    cookie.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    cookie.style.animationDelay = (Math.random() * 2) + 's';
                    cookieRain.appendChild(cookie);

                    setTimeout(() => cookie.remove(), 6000);
                }, i * 200);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
